farmaya:
  # Tiempos del flujo (segundos)
  search-timeout-seconds: 120          # espera de una farmacia antes de ampliar la zona
  pharmacy-confirm-timeout-seconds: 300 # tiempo de la farmacia para confirmar precios
  price-accept-timeout-seconds: 600     # tiempo del cliente para aceptar el precio
  max-search-rounds: 3                  # rondas de busqueda antes de vencer el pedido
  session-hours: 12
  max-active-deliveries: 2              # entregas simultaneas por repartidor
  zones: Cobertura General
  timezone: ${FARMAYA_TZ:}              # vacio = zona horaria del servidor (ej. America/Bogota)
  admin-email: ${FARMAYA_ADMIN_EMAIL:admin@farmaya.local}
  admin-password: ${FARMAYA_ADMIN_PASSWORD:Admin123!}
  seed-demo: ${FARMAYA_SEED_DEMO:true}  # crea cuentas de prueba al iniciar
